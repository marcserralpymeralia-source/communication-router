name: CI

on:
  push:
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: APP_ENV=development python -m compileall app scripts tests
      - name: Test suite
        run: APP_ENV=test python -m unittest discover -s tests
      - name: WhatsApp integration
        run: APP_ENV=test python -m unittest tests.test_whatsapp_integration
      - name: Core release guard
        run: |
          APP_ENV=test python -m unittest tests.test_messages_and_conversations
          APP_ENV=test python -m unittest tests.test_jobs_reliability
          APP_ENV=test python -m unittest tests.test_schema_migrations
      - name: Diff check
        run: git diff --check

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kibak_tenant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: PostgreSQL smoke
        env:
          POSTGRES_TEST_MASTER_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kibak_tenant_test
        run: APP_ENV=test python -m unittest tests.test_postgresql_smoke

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build KIBAK runtime image
        run: docker build --tag kibak-runtime:${{ github.sha }} .
